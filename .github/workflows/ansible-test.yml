name: Ansible tests

on:
  push:
    paths:
      - 'ansible/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changed: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ansible/roles/dns:
              - 'ansible/roles/dns/**'

  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
            
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      
      - name: Check Python version
        run: python3 --version

      - name: Setup Ansible
        working-directory: ansible
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Molecule test
        working-directory: ${{ steps.detect.outputs.has_changed }}
        run: molecule converge && molecule verify