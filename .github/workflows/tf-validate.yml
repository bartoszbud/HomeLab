name: Terraform Validate

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      roots_json: ${{ steps.detect-changes.outputs.roots_json }}
      modules_json: ${{ steps.detect-changes.outputs.modules_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect-changes
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD -- 'infra/**')
          direct_roots=()
          changed_modules=()

          for file in $changed_files; do
            if [[ "$file" == infra/envs/* ]]; then
              dir=$(dirname "$file")
              
              while [[ "$dir" != "infra/envs" && ! -f "$dir/backend.tf" ]]; do
                dir=$(dirname "$dir")
              done

              if [[ -f "$dir/backend.tf" ]]; then
                direct_roots+=("$dir")
              fi
            elif [[ "$file" == infra/modules/* ]]; then
              dir=$(dirname "$file")
              changed_modules+=("$dir")
            fi
          done

          direct_roots=($(printf "%s\n" "${direct_roots[@]}" | sort -u))
          changed_modules=($(printf "%s\n" "${changed_modules[@]}" | sort -u))

          echo "${direct_roots[@]}"
          echo "${changed_modules[@]}"

          roots=$(printf '%s\n' "${direct_roots[@]}" | grep -v '^$' | jq -R -s -c 'split("\n")[:-1]')
          modules=$(printf '%s\n' "${changed_modules[@]}" | grep -v '^$' | jq -R -s -c 'split("\n")[:-1]')

          echo "roots_json=$roots" >> "$GITHUB_OUTPUT"
          echo "modules_json=$modules" >> "$GITHUB_OUTPUT"
  
  validate:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.modules_json != '[]'
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.modules_json)}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize terraform
        id: init
        run: terraform init -backend=false -no-color
        working-directory: ${{ matrix.dir }}

      - name: Validate terraform
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}