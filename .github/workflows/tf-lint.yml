name: Terraform Lint

on:
  push:
    paths:
      - 'terraform/**'

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup terraform linter
        uses: terraform-linters/setup-tflint@v6
      
      - name: Terraform lint version
        run: tflint --version

      - name: Terraform lint init
        run: |
          cd terraform
          tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run linter
        run: tflint -f compact --chdir=terraform --recursive
