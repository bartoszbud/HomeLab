apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../bootstrap/
  - ../../environments/local/apps
  - ../../base/metal-lb
patches:
  - target:
      kind: Application
      name: kubernetes
    patch: |
      - op: replace
        path: /spec/source/targetRevision
        value: $BRANCH
  - target:
      kind: Application
      name: kubernetes
    patch: |
      - op: replace
        path: /spec/syncPolicy
        value: {}
  - target:
      kind: Application
      name: kubernetes
    patch: |
      - op: replace
        path: /spec/source/path
        value: kubernetes/environments/local/apps
  - target:
      kind: Application
      name: namespaces
    patch: |
      - op: replace
        path: /spec/source/targetRevision
        value: $BRANCH
  - target:
      kind: Application
      name: metallb
    patch: |
      - op: remove
        path: /spec/syncPolicy/automated
  - target:
      kind: IPAddressPool
      name: platform-pool
    patch: |
      - op: replace
        path: /spec/addresses
        value: ["10.10.10.50-10.10.10.60"]