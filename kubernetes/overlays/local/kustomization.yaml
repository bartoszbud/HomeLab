apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../bootstrap/
  - ../../environments/local/apps
patches:
  - target:
      kind: Application
      name: kubernetes
    patch: |
      - op: replace
        path: /spec/source/targetRevision
        value: $BRANCH
  - target:
      kind: Application
      name: kubernetes
    patch: |
      - op: replace
        path: /spec/source/path
        value: kubernetes/environments/local/apps
  - target:
      kind: Application
      name: namespaces
    patch: |
      - op: replace
        path: /spec/source/targetRevision
        value: $BRANCH
