---
# tasks file for hardening
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 86400
  when: ansible_os_family == "Debian"

- name: Ensure SSH is installed
  ansible.builtin.package:
    name: "openssh-server"
    state: present

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: "{{ 'sshd' if ansible_os_family in ['RedHat', 'Alpine'] else 'ssh' }}"
    state: started
    enabled: yes

- name: Backup existing sshd_config
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config_backup
    remote_src: yes
    owner: root
    group: root
    mode: '0600'
    backup: yes

- name: Add ansible_managed header to sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "# Ansible managed: Do NOT edit this file directly! Your changes will be overwritten.\n# Last modified on {{ ansible_date_time.date }}"
    insertbefore: BOF
    state: present

- name: Configure SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^(#)?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "AllowTcpForwarding", value: "no" }
    - { key: "ClientAliveCountMax", value: "2" }
    - { key: "Compression", value: "no" }
    - { key: "GatewayPorts", value: "no" }
    - { key: "LogLevel", value: "VERBOSE" }
    - { key: "MaxAuthTries", value: "1" }
    - { key: "MaxSessions", value: "2" }
    - { key: "TCPKeepAlive", value: "no" }
    - { key: "X11Forwarding", value: "no" }
    - { key: "AllowAgentForwarding", value: "no" }
  notify: 
    - Restart sshd

- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/fail2ban/jail.d/sshd.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart fail2ban

- name: Ensure fail2ban is running and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes
