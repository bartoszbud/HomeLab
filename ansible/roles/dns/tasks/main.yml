---
# tasks file for dns
- name: Install packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ packages }}"
  when: packages is defined and packages | length > 0 and inventory_hostname in groups['dns']

- name: Copy DNS zone file
  ansible.builtin.copy:
    src: "files/db.lab.pl"
    dest: "/etc/named/"
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['dns']
  tags: update

- name: Copy reverse DNS zone file
  ansible.builtin.copy:
    src: "files/db.10.0.0"
    dest: "/etc/named/"
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['dns']
  tags: update

- name: Copy zone configuration file
  ansible.builtin.copy:
    src: "files/named.conf.local"
    dest: "/etc/named/"
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['dns']

- name: Copy configuration files for BIND primary
  ansible.builtin.copy:
    src: "files/named-primary.conf"
    dest: "/etc/named.conf"
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == "dns-master"

- name: Copy configuration files for BIND secondary
  ansible.builtin.copy:
    src: "files/named-secondary.conf"
    dest: "/etc/named.conf"
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == "dns-slave"

- name: Start and enable BIND service
  ansible.builtin.systemd:
    name: named
    state: restarted
    enabled: yes
  when: inventory_hostname in groups['dns']
  