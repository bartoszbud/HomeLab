---
# tasks file for lxc_ssh
- name: Get list of LXC containers
  ansible.builtin.command: lxc-ls --quiet --running
  register: lxc_ssh_lxc_containers
  tags: lxc
  changed_when: false

- name: Show LXC container IDs
  ansible.builtin.debug:
    var: lxc_ssh_lxc_containers.stdout_lines
  tags: lxc

- name: Debug which containers host sees
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} keeps: {{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  tags: lxc

- name: Check if OpenSSH server is installed
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- rpm -q openssh-server
  loop: "{{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  register: lxc_ssh_ssh_check
  ignore_errors: true
  tags: lxc
  changed_when: false
  failed_when: false
    #ansible.builtin.command: item.rc != 0 

- name: Install OpenSSH server
  ansible.builtin.command: lxc-attach --quiet -n {{ item.item }} -- yum install -y openssh-server
  #loop: "{{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  loop: "{{ lxc_ssh_ssh_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  failed_when: false
    #ansible.builtin.command: item.rc != 0 
  tags: lxc
  changed_when: false

- name: Start OpenSSH server
  ansible.builtin.command: lxc-attach --quiet -n {{ item.item }} -- systemctl start sshd.service
  #loop: "{{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  loop: "{{ lxc_ssh_ssh_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  tags: lxc
  failed_when: false
    #ansible.builtin.command: item.rc != 0 
  changed_when: false

- name: Check if admin user exists in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- id -u admin
  loop: "{{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  register: lxc_ssh_admin_check
  ignore_errors: true
  tags: lxc
  changed_when: false
  failed_when: false
    #ansible.builtin.command: item.rc != 0

- name: Create admin user in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- useradd -m -s /bin/bash admin
  #loop: "{{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  loop: "{{ lxc_ssh_admin_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  tags: lxc
  failed_when: false
    #ansible.builtin.command: item.rc != 0 
  changed_when: true

- name: Check if admin has nopasswd sudo in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- grep -q '^admin ALL=(ALL) NOPASSWD:ALL' /etc/sudoers.d/admin
  loop: "{{ hostvars[inventory_hostname]['lxc_ssh_lxc_containers']['stdout_lines'] }}"
  register: lxc_ssh_admin_sudo_check
  ignore_errors: true
  tags: lxc
  changed_when: false
  failed_when: false
    #ansible.builtin.command: item.rc != 0
  
- name: Set nopasswd sudo for admin user in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- bash -c "echo 'admin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/admin"
  loop: "{{ lxc_ssh_admin_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  tags: lxc
  failed_when: false
    #ansible.builtin.command: item.rc != 0 
  changed_when: true