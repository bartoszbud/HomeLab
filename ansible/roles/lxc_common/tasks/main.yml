---
# tasks file for lxc_common
- name: Get list of LXC containers
  ansible.builtin.command: lxc-ls --quiet --running
  register: lxc_common_lxc_containers
  changed_when: false
  tags: always

- name: Show LXC container IDs
  ansible.builtin.debug:
    var: lxc_common_lxc_containers.stdout_lines
  tags: never, debug

- name: List containers on the host
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} keeps: {{ lxc_common_lxc_containers.stdout_lines }}"
  tags: always

- name: Check if admin user exists in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- id -u admin
  loop: "{{ lxc_common_lxc_containers.stdout_lines }}"
  register: lxc_common_admin_check
  changed_when: false
  failed_when: false
  tags: always

- name: Show admin user check results
  ansible.builtin.debug:
    var: lxc_common_admin_check.results
  tags: never, debug

- name: Create admin user in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item.item }} -- useradd -m -s /bin/bash admin
  loop: "{{ lxc_common_admin_check.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  tags: always

- name: Check if admin has nopasswd sudo in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- grep -q '^admin ALL=(ALL) NOPASSWD:ALL' /etc/sudoers.d/admin
  loop: "{{ lxc_common_lxc_containers.stdout_lines }}"
  register: lxc_common_admin_sudo_check
  changed_when: false
  failed_when: false
  tags: always
  
- name: Set nopasswd sudo for admin user in LXC containers
  ansible.builtin.command: lxc-attach --quiet -n {{ item.item }} -- bash -c "echo 'admin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/admin"
  loop: "{{ lxc_common_admin_sudo_check.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  tags: always

- name: Apply SSH key to admin user in LXC containers
  ansible.builtin.command: >-
    lxc-attach --quiet -n {{ item }} --
    bash -c 'mkdir -p /home/admin/.ssh && 
    cat > /home/admin/.ssh/authorized_keys && 
    chmod 0600 /home/admin/.ssh/authorized_keys && 
    chown -R admin:admin /home/admin/.ssh'
  args:
    stdin: "{{ lookup('file', 'files/lxc.pub') }}"
  loop: "{{ lxc_common_lxc_containers.stdout_lines }}"
  changed_when: false
  tags: always

- name: Check if OpenSSH server is installed
  ansible.builtin.command: lxc-attach --quiet -n {{ item }} -- rpm -q openssh-server
  loop: "{{ lxc_common_lxc_containers.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  register: lxc_common_ssh_check
  changed_when: false
  failed_when: false
  tags: always

- name: Show OpenSSH server check results
  ansible.builtin.debug:
    var: lxc_common_ssh_check.results
  tags: never, debug

- name: Install OpenSSH server
  ansible.builtin.command: lxc-attach --quiet -n {{ item.item }} -- yum install -y openssh-server
  loop: "{{ lxc_common_ssh_check.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  failed_when: false
  tags: always

- name: Start OpenSSH server
  ansible.builtin.command: lxc-attach --quiet -n {{ item.item }} -- systemctl enable --now sshd.service
  loop: "{{ lxc_common_ssh_check.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  tags: always
