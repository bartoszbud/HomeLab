---
# tasks file for common
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 86400
  when: ansible_facts.os_family == "Debian"

- name: Load common variables
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"
  tags: always

- name: Install packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ common_packages }}"
  when: common_packages is defined and common_packages | length > 0
  tags: always

- name: Render MOTD template
  ansible.builtin.command: "figlet {{ ansible_facts.hostname }}"
  register: common_motd_banner
  changed_when: false
  tags: always

- name: Setup motd
  ansible.builtin.template:
    src: motd.j2
    dest: "/etc/motd"
    mode: '0644'
  tags: always

- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ common_timezone }}"
  when: common_timezone is defined
  changed_when: false
  tags: always
