#---------------------------------------------------------------------
# Example configuration for a possible web application.  See the
# full configuration options online.
#
#   https://www.haproxy.org/download/1.8/doc/configuration.txt
#
#---------------------------------------------------------------------

#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    # to have these messages end up in /var/log/haproxy.log you will
    # need to:
    #
    # 1) configure syslog to accept network log events.  This is done
    #    by adding the '-r' option to the SYSLOGD_OPTIONS in
    #    /etc/sysconfig/syslog
    #
    # 2) configure local2 events to go to the /var/log/haproxy.log
    #   file. A line like the following can be added to
    #   /etc/sysconfig/syslog
    #
    #    local2.*                       /var/log/haproxy.log
    #
    log         127.0.0.1 local2

    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon

    # turn on stats unix socket
    stats socket /var/lib/haproxy/stats

    # utilize system-wide crypto-policies
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

#---------------------------------------------------------------------
# common defaults that all the 'listen' and 'backend' sections will
# use if not designated in their block
#---------------------------------------------------------------------
defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option http-server-close
    option forwardfor       except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

#---------------------------------------------------------------------
# main frontend which proxys to the backends
#---------------------------------------------------------------------
#frontend main
#    bind 10.0.0.12:80
#    acl url_static       path_beg       -i /static /images /javascript /stylesheets
#    acl url_static       path_end       -i .jpg .gif .png .css .js

#    use_backend static          if url_static
#    default_backend             app

frontend main
    bind 10.0.0.12:80
    default_backend             rp-nossl

frontend ssl
    bind 10.0.0.12:443 ssl crt /etc/ssl/certs/lab.pl.crt ssl-min-ver TLSv1.2
    default_backend             rp-ssl
    
frontend kube
    bind 10.0.2.49:6443
    mode tcp
    default_backend             kubecluster

frontend nexus-int-podman
    bind 10.0.0.66:443 ssl crt /etc/ssl/certs/lab.pl.crt ssl-min-ver TLSv1.2
    default_backend             int-nexus-pod

frontend nexus-ext-podman
    bind 10.0.0.67:443 ssl crt /etc/ssl/certs/lab.pl.crt ssl-min-ver TLSv1.2
    default_backend             ext-nexus-pod
#---------------------------------------------------------------------
# static backend for serving up images, stylesheets and such
#---------------------------------------------------------------------
#backend static
#    balance     roundrobin
#    server      static 127.0.0.1:4331 check

#---------------------------------------------------------------------
# round robin balancing between the various backends
#---------------------------------------------------------------------
backend rp-nossl
    balance     roundrobin
    server  app1 10.0.0.15:80 check
    server  app2 10.0.0.16:80 check

backend rp-ssl
    balance     roundrobin
    server  app1 10.0.0.15:443 check check ssl verify none 
    server  app2 10.0.0.16:443 check check ssl verify none

backend kubecluster
    balance     roundrobin
    mode        tcp
    option      ssl-hello-chk
    default-server inter 3s fall 3s rise 2s
    server  kube-m1 10.0.0.110:6443 check
    server  kube-m2 10.0.0.111:6443 check
    server  kube-m3 10.0.0.112:6443 check

backend int-nexus-pod
    balance     roundrobin
    server  int-nx 10.0.0.24:8083 check check ssl verify none

backend ext-nexus-pod
    balance     roundrobin
    server  ext-nx 10.0.0.24:8082 check check ssl verify none